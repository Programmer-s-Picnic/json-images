 <text x="61" y="73" font-family="Arial,sans-serif" font-size="29" fill="#153f66" font-weight="700">Windows PowerShell: connect using SSH</text><rect x="42" y="110" width="1116" height="495" rx="10" fill="#16212b"/><rect x="42" y="110" width="1116" height="57" rx="10" fill="#314457"/><text x="74" y="147" font-family="Arial,sans-serif" font-size="19" fill="#dceaf7" font-weight="700">Windows PowerShell  / example commands</text><text x="80" y="208" font-family="Consolas,monospace" font-size="20" fill="#e6edf7" font-weight="400">PS&gt; ssh -p 2222 student@127.0.0.1</text><text x="80" y="252" font-family="Consolas,monospace" font-size="20" fill="#96e6bd" font-weight="400">student@127.0.0.1's password:</text><text x="80" y="296" font-family="Consolas,monospace" font-size="20" fill="#e6edf7" font-weight="400">Welcome to Ubuntu Server</text><text x="80" y="340" font-family="Consolas,monospace" font-size="20" fill="#e6edf7" font-weight="400">student@champak-ubuntu:~$ hostname -I</text><text x="80" y="384" font-family="Consolas,monospace" font-size="20" fill="#e6edf7" font-weight="400">10.0.2.15</text><text x="80" y="428" font-family="Consolas,monospace" font-size="20" fill="#e6edf7" font-weight="400">student@champak-ubuntu:~$ pwd</text><text x="80" y="472" font-family="Consolas,monospace" font-size="20" fill="#e6edf7" font-weight="400">/home/student</text>
