 <text x="61" y="73" font-family="Arial,sans-serif" font-size="29" fill="#153f66" font-weight="700">Ubuntu: install and test Nginx</text><rect x="42" y="110" width="1116" height="495" rx="10" fill="#16212b"/><rect x="42" y="110" width="1116" height="57" rx="10" fill="#314457"/><text x="74" y="147" font-family="Arial,sans-serif" font-size="19" fill="#dceaf7" font-weight="700">student@champak-ubuntu:~$ terminal</text><text x="80" y="208" font-family="Consolas,monospace" font-size="20" fill="#e6edf7" font-weight="400">$ sudo apt update</text><text x="80" y="252" font-family="Consolas,monospace" font-size="20" fill="#e6edf7" font-weight="400">$ sudo apt install -y nginx curl</text><text x="80" y="296" font-family="Consolas,monospace" font-size="20" fill="#e6edf7" font-weight="400">$ sudo systemctl enable --now nginx</text><text x="80" y="340" font-family="Consolas,monospace" font-size="20" fill="#96e6bd" font-weight="400">$ sudo systemctl is-active nginx</text><text x="80" y="384" font-family="Consolas,monospace" font-size="20" fill="#96e6bd" font-weight="400">active</text><text x="80" y="428" font-family="Consolas,monospace" font-size="20" fill="#e6edf7" font-weight="400">$ curl -I http://127.0.0.1/</text><text x="80" y="472" font-family="Consolas,monospace" font-size="20" fill="#96e6bd" font-weight="400">HTTP/1.1 200 OK</text><text x="80" y="516" font-family="Consolas,monospace" font-size="20" fill="#e6edf7" font-weight="400">Server: nginx</text>
 <text x="60" y="635" font-family="Arial,sans-serif" font-size="17" fill="#61788e" font-weight="400">ILLUSTRATION — simulated interface, not an actual screenshot</text>
