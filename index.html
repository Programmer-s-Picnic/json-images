<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy New Year 🎆</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --gold:#fbbf24;
  --saffron:#ff9933;
  --bg1:#020617;
  --bg2:#0f172a;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:
    radial-gradient(circle at top,#1e293b,var(--bg1)),
    linear-gradient(135deg,var(--bg1),var(--bg2));
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  color:#fff;
  overflow:hidden;
}

/* Stars */
.star{
  position:absolute;
  width:2px;height:2px;
  background:#fff;border-radius:50%;
  animation:twinkle 3s infinite;
}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

/* Card */
.card{
  position:absolute;
  inset:0;
  margin:auto;
  max-width:460px;
  padding:36px 34px;
  border-radius:24px;
  text-align:center;
  background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  backdrop-filter:blur(14px);
  box-shadow:0 25px 60px rgba(0,0,0,.55);
  z-index:10;
}

.year{
  font-size:70px;
  font-weight:800;
  letter-spacing:4px;
  color:var(--gold);
  text-shadow:0 0 30px rgba(251,191,36,.9);
}

.title{
  font-size:30px;
  background:linear-gradient(90deg,#fff,var(--gold));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.countdown{
  margin:14px 0;
  font-size:18px;
  color:#fde68a;
}

.msg{
  font-size:17px;
  line-height:1.7;
  color:#e5e7eb;
}

/* Real caricature image */
.avatar img{
  width:120px;
  border-radius:18px;
  margin:18px auto 10px;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  display:block;
}

/* QR */
.qr img{
  width:110px;
  background:#fff;
  padding:6px;
  border-radius:14px;
}

/* Buttons */
.controls{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:18px;
}

.btn{
  padding:12px 16px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--saffron),var(--gold));
  color:#000;
  font-weight:600;
  cursor:pointer;
  border:none;
}

.footer{
  margin-top:14px;
  font-size:13px;
  color:#facc15;
}

/* Canvas */
canvas{
  position:absolute;
  inset:0;
  z-index:1;
}
</style>
</head>

<body>

<canvas id="fw"></canvas>

<div class="card">
  <div class="year">2026</div>
  <div class="title">Happy New Year 🎉</div>

  <div class="countdown" id="countdown"></div>

  <div class="msg">
    May this year bring<br>
    <b>clarity in code</b>, <b>peace in mind</b>, and<br>
    <b>joy in teaching.</b>
  </div>

  <!-- REAL ILLUSTRATED CARICATURE -->
  <div class="avatar">
    <img src="https://cdn.pixabay.com/photo/2023/01/31/09/12/teacher-7756745_1280.png"
         alt="Programmer Teacher Illustration">
  </div>

  <!-- QR -->
  <div class="qr">
    <img id="qrImg" alt="QR Code">
  </div>

  <div class="controls">
    <button class="btn" onclick="toggleMusic()">🎵 Music</button>
    <button class="btn" onclick="share()">📲 WhatsApp</button>
  </div>

  <div class="footer">
    ✨ Programmer’s Picnic ✨
  </div>
</div>

<!-- 🎶 REAL MUSIC (ROYALTY FREE) -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/30/audio_946b64f05c.mp3" type="audio/mpeg">
</audio>

<script>
/* Stars */
for(let i=0;i<80;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  s.style.animationDelay=Math.random()*3+"s";
  document.body.appendChild(s);
}

/* Countdown */
const target=new Date("Jan 1, 2026 00:00:00").getTime();
setInterval(()=>{
  const d=target-Date.now();
  if(d<=0){countdown.innerHTML="🎆 Welcome 2026 🎆";return;}
  countdown.innerHTML=`⏳ ${Math.floor(d/36e5)}h ${Math.floor(d%36e5/6e4)}m ${Math.floor(d%6e4/1e3)}s`;
},1000);

/* Music */
const music=document.getElementById("music");
let playing=false;
function toggleMusic(){playing?music.pause():music.play();playing=!playing}

/* Share */
function share(){
  open(`https://wa.me/?text=${encodeURIComponent("🎉 Happy New Year 2026 ✨ "+location.href)}`,"_blank");
}

/* QR */
qrImg.src=`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(location.href)}`;

/* Fireworks */
const c=document.getElementById("fw"),x=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();addEventListener("resize",resize);
let f=[];
setInterval(()=>f.push({x:Math.random()*c.width,y:c.height,vy:-7,p:[]}),900);

function draw(){
  x.clearRect(0,0,c.width,c.height);
  f.forEach((o,i)=>{
    o.y+=o.vy;
    if(o.y<c.height*.35){
      for(let a=0;a<28;a++)
        o.p.push({x:o.x,y:o.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,l:60});
      f.splice(i,1);
    }
  });
  f.forEach(o=>x.fillRect(o.x,o.y,3,3));
  f.flatMap(o=>o.p||[]).forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.l--;
    x.fillStyle="rgba(251,191,36,.8)";
    x.fillRect(p.x,p.y,2,2);
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
