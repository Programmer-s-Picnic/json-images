<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy New Year 🎆</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --gold:#fbbf24;
  --saffron:#ff9933;
  --bg1:#020617;
  --bg2:#0f172a;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:
    radial-gradient(circle at top,#1e293b,var(--bg1)),
    linear-gradient(135deg,var(--bg1),var(--bg2));
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  color:#fff;
  overflow:hidden;
}

/* ===== STARS ===== */
.star{
  position:absolute;
  width:2px;height:2px;
  background:#fff;border-radius:50%;
  animation:twinkle 3s infinite ease-in-out;
}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

/* ===== CARD ===== */
.card{
  position:absolute;
  inset:0;
  margin:auto;
  max-width:460px;
  padding:38px 34px;
  border-radius:24px;
  text-align:center;
  background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  backdrop-filter:blur(14px);
  box-shadow:0 25px 60px rgba(0,0,0,.55);
  z-index:10;
}

.year{
  font-size:70px;
  font-weight:800;
  letter-spacing:4px;
  color:var(--gold);
  text-shadow:0 0 30px rgba(251,191,36,.9);
}

.title{
  font-size:30px;
  margin-top:6px;
  background:linear-gradient(90deg,#fff,var(--gold));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.countdown{
  margin:14px 0;
  font-size:18px;
  color:#fde68a;
}

.msg{
  font-size:17px;
  line-height:1.7;
  color:#e5e7eb;
}

/* ===== CHAMPAK ROY STYLE COMIC ===== */
.avatar{
  margin:22px auto 10px;
  width:110px;height:150px;
  position:relative;
}

/* Head */
.head{
  width:90px;height:90px;
  background:radial-gradient(circle,#ffe4c4,#facc15);
  border-radius:50%;
  margin:auto;
  position:relative;
}

/* Eyes */
.head:before{
  content:"";
  position:absolute;
  top:34px;left:22px;
  width:10px;height:10px;
  background:#000;border-radius:50%;
  box-shadow:36px 0 0 #000;
}

/* Smile */
.head:after{
  content:"";
  position:absolute;
  bottom:22px;left:26px;
  width:38px;height:8px;
  border-radius:20px;
  border-bottom:3px solid #000;
}

/* Tilak */
.tilak{
  position:absolute;
  top:12px;left:50%;
  transform:translateX(-50%);
  width:6px;height:16px;
  background:var(--saffron);
  border-radius:4px;
}

/* Body */
.body{
  width:110px;height:60px;
  background:linear-gradient(135deg,#ffedd5,#ff9933);
  border-radius:0 0 18px 18px;
  margin:auto;
  margin-top:-8px;
  position:relative;
}

/* Laptop */
.laptop{
  position:absolute;
  bottom:6px;left:50%;
  transform:translateX(-50%);
  width:60px;height:14px;
  background:#1f2937;
  border-radius:4px;
}

/* ===== QR ===== */
.qr{
  margin-top:16px;
}
.qr img{
  width:110px;height:110px;
  border-radius:14px;
  background:#fff;
  padding:6px;
}

/* ===== BUTTONS ===== */
.controls{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:18px;
}

.btn{
  padding:12px 16px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--saffron),var(--gold));
  color:#000;
  font-weight:600;
  cursor:pointer;
  border:none;
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.footer{
  margin-top:14px;
  font-size:13px;
  color:#facc15;
}

/* ===== CANVAS ===== */
canvas{
  position:absolute;
  inset:0;
  z-index:1;
}
</style>
</head>

<body>

<canvas id="fw"></canvas>

<!-- CARD -->
<div class="card">
  <div class="year">2026</div>
  <div class="title">Happy New Year 🎉</div>

  <div class="countdown" id="countdown"></div>

  <div class="msg">
    May this year bring<br>
    <b>clean code</b>, <b>clear mind</b>, and<br>
    <b>peace beyond bugs.</b>
  </div>

  <!-- Comic Champak Roy -->
  <div class="avatar">
    <div class="head">
      <div class="tilak"></div>
    </div>
    <div class="body">
      <div class="laptop"></div>
    </div>
  </div>

  <!-- QR -->
  <div class="qr">
    <div style="font-size:13px;color:#fde68a;margin-bottom:6px;">
      📷 Scan to Share
    </div>
    <img id="qrImg" alt="QR Code">
  </div>

  <div class="controls">
    <button class="btn" onclick="toggleMusic()">🎵 Music</button>
    <button class="btn" onclick="share()">📲 WhatsApp</button>
  </div>

  <div class="footer">
    ✨ Programmer’s Picnic ✨
  </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/12/27/audio_49f76fbd30.mp3" type="audio/mpeg">
</audio>

<script>
/* STARS */
for(let i=0;i<90;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  s.style.animationDelay=Math.random()*3+"s";
  document.body.appendChild(s);
}

/* COUNTDOWN */
const target=new Date("Jan 1, 2026 00:00:00").getTime();
setInterval(()=>{
  const d=target-Date.now();
  if(d<=0){countdown.innerHTML="🎆 Welcome 2026 🎆";return;}
  const h=Math.floor(d/36e5);
  const m=Math.floor(d%36e5/6e4);
  const s=Math.floor(d%6e4/1e3);
  countdown.innerHTML=`⏳ ${h}h ${m}m ${s}s`;
},1000);

/* MUSIC */
const music=document.getElementById("music");
let playing=false;
function toggleMusic(){playing?music.pause():music.play();playing=!playing}

/* SHARE */
function share(){
  const t="🎉 Happy New Year 2026! May your code compile and dreams execute ✨";
  open(`https://wa.me/?text=${encodeURIComponent(t+" "+location.href)}`,"_blank");
}

/* QR */
const qr=document.getElementById("qrImg");
qr.src=`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(location.href)}`;

/* FIREWORKS */
const c=document.getElementById("fw"),x=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();addEventListener("resize",resize);
let p=[];
setInterval(()=>p.push({x:Math.random()*c.width,y:c.height,vy:-7,pts:[]}),900);

function draw(){
  x.clearRect(0,0,c.width,c.height);
  p.forEach((f,i)=>{
    f.y+=f.vy;
    if(f.y<c.height*.35){
      for(let a=0;a<28;a++)
        f.pts.push({x:f.x,y:f.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,l:60});
      p.splice(i,1);
    }
  });
  p.forEach(f=>x.fillRect(f.x,f.y,3,3));
  p.flatMap(f=>f.pts||[]).forEach(o=>{
    o.x+=o.vx;o.y+=o.vy;o.l--;
    x.fillStyle="rgba(251,191,36,.8)";
    x.fillRect(o.x,o.y,2,2);
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
