name: Publish delivery partner APK
on:
  push:
    branches: [main]
    paths: ['delivery-artifact.json', '.github/workflows/publish-delivery-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download successful notification partner build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/delivery-partner
          gh run watch 36692169767 --repo Programmer-s-Picnic/delivery-app --exit-status
          gh run download 36692169767 --repo Programmer-s-Picnic/delivery-app --name delivery-partner-apk --dir /tmp/delivery-partner
          test -s /tmp/delivery-partner/app-release.apk
      - name: Update permanent download path
        run: |
          mkdir -p delivery
          install -m 644 /tmp/delivery-partner/app-release.apk delivery/DeliveryPartner.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delivery/DeliveryPartner.apk
          git diff --cached --quiet || { git commit -m 'Publish delivery partner APK at fixed URL'; git push; }
