name: Publish delivery partner APK
on:
  push:
    branches: [main]
    paths: ['delivery-artifact.json', '.github/workflows/publish-delivery-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify source build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 362be3fb2c2f90754869e5f7c0fa8f81fefc9065
        run: |
          run_id=$(gh run list --repo Programmer-s-Picnic/delivery-app --workflow partner-apk.yml --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId" | head -1)
          test -n "$run_id"
          gh run watch "$run_id" --repo Programmer-s-Picnic/delivery-app --exit-status
          test "$(gh run view "$run_id" --repo Programmer-s-Picnic/delivery-app --json headSha --jq .headSha)" = "$SOURCE_SHA"
          mkdir -p /tmp/delivery-partner
          gh run download "$run_id" --repo Programmer-s-Picnic/delivery-app --name delivery-partner-apk --dir /tmp/delivery-partner
          test -s /tmp/delivery-partner/app-release.apk
      - name: Update permanent download path
        run: |
          mkdir -p delivery
          install -m 644 /tmp/delivery-partner/app-release.apk delivery/DeliveryPartner.apk
          sha256sum delivery/DeliveryPartner.apk > delivery/SHA256SUMS
          printf '%s\n' '{"sourceCommit":"362be3fb2c2f90754869e5f7c0fa8f81fefc9065","version":"1.0.4+5","workflowRun":36979107357}' > delivery/build.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delivery/DeliveryPartner.apk delivery/SHA256SUMS delivery/build.json
          git diff --cached --quiet || { git commit -m 'Publish validated partner cleanup APK at fixed URL'; git push; }
