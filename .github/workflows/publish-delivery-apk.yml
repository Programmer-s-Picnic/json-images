name: Publish delivery partner APK
on:
  push:
    branches: [main]
    paths: ['delivery-artifact.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified APK artifact
        run: |
          url=$(jq -r '.artifactUrl' delivery-artifact.json)
          expected=$(jq -r '.apkSha256' delivery-artifact.json)
          test -n "$url" && test "$url" != null
          curl --fail --location --retry 3 --output /tmp/delivery-partner.zip "$url"
          mkdir -p /tmp/delivery-partner
          unzip -j /tmp/delivery-partner.zip app-release.apk -d /tmp/delivery-partner
          printf '%s  %s\n' "$expected" /tmp/delivery-partner/app-release.apk | sha256sum --check -
      - name: Update permanent download path
        run: |
          mkdir -p delivery
          install -m 644 /tmp/delivery-partner/app-release.apk delivery/DeliveryPartner.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delivery/DeliveryPartner.apk
          git diff --cached --quiet || { git commit -m 'Publish delivery partner APK at fixed URL'; git push; }
