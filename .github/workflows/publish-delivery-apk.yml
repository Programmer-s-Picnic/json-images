name: Publish delivery partner APK
on:
  push:
    branches: [main]
    paths:
      - 'delivery-brand-release.json'
      - '.github/workflows/publish-delivery-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-delivery-partner-fixed-apk
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for verified delivery partner build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(jq -er .sourceCommit delivery-brand-release.json)
          version=$(jq -er .version delivery-brand-release.json)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          for attempt in $(seq 1 60); do
            gh run list --repo Programmer-s-Picnic/delivery-app --workflow partner-apk.yml \
              --limit 100 --json databaseId,headSha,status,conclusion > /tmp/delivery-runs.json
            run=$(jq -r --arg sha "$sha" '[.[] | select(.headSha==$sha and .conclusion=="success")] | first | .databaseId // empty' /tmp/delivery-runs.json)
            failed=$(jq -r --arg sha "$sha" '[.[] | select(.headSha==$sha and .conclusion=="failure")] | first | .conclusion // empty' /tmp/delivery-runs.json)
            if [ -n "$run" ]; then echo "$run" > /tmp/delivery-run; break; fi
            if [ -n "$failed" ]; then echo "::error::Verified source build failed"; exit 1; fi
            if [ "$attempt" = 60 ]; then echo "::error::Timed out waiting for delivery APK build"; exit 1; fi
            sleep 10
          done
          run=$(cat /tmp/delivery-run)
          test "$(gh run view "$run" --repo Programmer-s-Picnic/delivery-app --json headSha --jq .headSha)" = "$sha"
          mkdir -p /tmp/delivery-partner
          gh run download "$run" --repo Programmer-s-Picnic/delivery-app --name delivery-partner-apk --dir /tmp/delivery-partner
          test "$(stat -c '%s' /tmp/delivery-partner/app-release.apk)" -gt 1000000
          unzip -t /tmp/delivery-partner/app-release.apk >/dev/null
      - name: Publish at unchanged DeliveryPartner.apk URL
        run: |
          set -euo pipefail
          mkdir -p delivery
          install -m 644 /tmp/delivery-partner/app-release.apk delivery/DeliveryPartner.apk
          (cd delivery && sha256sum DeliveryPartner.apk > SHA256SUMS)
          jq -n --arg commit "$(jq -r .sourceCommit delivery-brand-release.json)" \
             --arg version "$(jq -r .version delivery-brand-release.json)" \
             --argjson run "$(cat /tmp/delivery-run)" \
             '{sourceCommit:$commit,version:$version,workflowRun:$run}' > delivery/build.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delivery/DeliveryPartner.apk delivery/SHA256SUMS delivery/build.json
          git diff --cached --quiet || { git commit -m "Publish verified Easy Mandi delivery app $(jq -r .version delivery-brand-release.json)"; git pull --rebase origin main; git push; }
