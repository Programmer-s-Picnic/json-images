name: Build and publish Champak TV Remote APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-champak-phone-remote.yml"
concurrency:
  group: champaks-tv-remote-publish
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out distribution repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch remote application source
        run: git clone --depth 1 https://github.com/Programmer-s-Picnic/tv.git "$RUNNER_TEMP/tv"
      - name: Generate Android project
        working-directory: ${{ runner.temp }}/tv/phone_remote
        run: flutter create --platforms android --org live.learnwithchampak .
      - name: Configure Android
        working-directory: ${{ runner.temp }}/tv/phone_remote
        run: python3 scripts/configure_android.py
      - name: Install Flutter packages
        working-directory: ${{ runner.temp }}/tv/phone_remote
        run: flutter pub get
      - name: Generate launcher icon and store artwork
        working-directory: ${{ runner.temp }}/tv/phone_remote
        run: |
          python3 -m pip install --user cairosvg pillow
          python3 scripts/generate_branding.py
          dart run flutter_launcher_icons
      - name: Build release APK
        working-directory: ${{ runner.temp }}/tv/phone_remote
        run: flutter build apk --release
      - name: Prepare download file
        run: |
          cp "$RUNNER_TEMP/tv/phone_remote/build/app/outputs/flutter-apk/app-release.apk" tv/champaks-tv-remote-v0.5.apk
          ls -lh tv/champaks-tv-remote-v0.5.apk
          sha256sum tv/champaks-tv-remote-v0.5.apk > tv/champaks-tv-remote-v0.5.sha256
          cp "$RUNNER_TEMP/tv/phone_remote/assets/play_store_icon.png" tv/champaks-tv-remote-store-icon.png
          cp "$RUNNER_TEMP/tv/phone_remote/assets/feature_graphic.png" tv/champaks-tv-remote-feature-graphic.png
      - name: Publish APK to GitHub Pages repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv/champaks-tv-remote-v0.5.apk tv/champaks-tv-remote-v0.5.sha256 tv/champaks-tv-remote-store-icon.png tv/champaks-tv-remote-feature-graphic.png
          if git diff --cached --quiet; then
            echo "APK has not changed"
          else
            git commit -m "Publish Champak TV Remote v0.5 Android APK"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: champaks-tv-remote-v0.5-apk
          path: tv/champaks-tv-remote-v0.5.apk
