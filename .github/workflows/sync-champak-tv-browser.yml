name: Sync Champak TV Browser APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-champak-tv-browser.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout json-images
        uses: actions/checkout@v4

      - name: Download latest Champak TV Browser APK
        run: |
          mkdir -p tv
          curl -L --fail --retry 3             "https://raw.githubusercontent.com/Programmer-s-Picnic/tv/main/downloads/champak-tv-browser.apk"             -o tv/champak-tv-browser.apk
          test -s tv/champak-tv-browser.apk

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv/champak-tv-browser.apk
          if ! git diff --cached --quiet; then
            git commit -m "Update Champak TV Browser APK"
            git push
          fi
