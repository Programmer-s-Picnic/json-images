name: Build Learn With Champak Windows Installer

on:
  push:
    paths:
      - "windows_app/**"
      - ".github/workflows/build-learn-with-champak-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner
        working-directory: windows_app
        run: flutter create --platforms=windows --project-name learn_with_champak_windows .

      - name: Create Champak app icon
        shell: pwsh
        working-directory: windows_app
        run: |
          choco install imagemagick.app --no-progress -y
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Invoke-WebRequest -Uri "https://programmer-s-picnic.github.io/json-images/tv/champak-photo.png" -OutFile "assets\champak-photo.png"
          magick assets\champak-photo.png -resize 256x256^ -gravity center -extent 256x256 windows\runner\resources\app_icon.ico
          Get-Item windows\runner\resources\app_icon.ico

      - name: Patch Windows compiler flags
        shell: pwsh
        working-directory: windows_app
        run: |
          $cmake = "windows\CMakeLists.txt"
          $flag = 'add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)'
          $text = Get-Content $cmake -Raw
          if ($text -notmatch '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS') {
            Set-Content -Path $cmake -Value ($flag + "`r`n" + $text)
          }
          Get-Content $cmake | Select-Object -First 8

      - name: Restore dependencies
        working-directory: windows_app
        run: flutter pub get

      - name: Build Flutter Windows release
        working-directory: windows_app
        run: flutter build windows --release

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows | Out-Null
          Compress-Archive -Path windows_app\build\windows\x64\runner\Release\* -DestinationPath windows\learn-with-champak-windows-portable.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer EXE
        shell: pwsh
        working-directory: windows_app
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc installer\learn_with_champak.iss

      - name: Publish installer and portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows | Out-Null
          Copy-Item windows_app\dist\learn-with-champak-windows-setup.exe windows\learn-with-champak-windows-setup.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add windows/learn-with-champak-windows-setup.exe windows/learn-with-champak-windows-portable.zip windows/learn-with-champak-windows-version.json
          git commit -m "Publish Learn With Champak Windows multi tab installer" || echo "No Windows app changes to commit"
          git push
